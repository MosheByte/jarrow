# Build tool versions for the probe. Game, loader and API versions are not here: they come from
# research-lock.json (see build.gradle). Gradle itself is pinned in .github/workflows/harness.yml
# and docs/probes.md, because the repository has no Gradle wrapper (no .jar files are committed).
loom_version=1.17.21
moddev_version=2.0.148
probe_version=0.1.0

org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=4
