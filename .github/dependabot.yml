# Weekly dependency updates; minor and patch bumps are grouped into one PR per ecosystem.
# Majors arrive one PR each so they get read.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: deps
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: deps
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: deps
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: deps
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
