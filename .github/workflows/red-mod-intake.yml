# Red mod intake: when an issue with the label red-mod is opened or edited (or gets the label),
# read the Modrinth URL from the issue form and post one comment with what Modrinth and the
# board say about that mod. The comment is found again by its hidden marker and edited, so an
# edited issue never collects a second comment.
# The form field id is "source-mod-url" or "mod-url" (both accepted while the form is renamed);
# its label is read from .github/ISSUE_TEMPLATE/red-mod-report.yml on the default branch through
# the API. Nothing is checked out. The board and the site link to the form with the URL
# filled in; see docs/community-automation.md.
name: red-mod-intake

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read

concurrency:
  group: red-mod-intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  intake:
    name: intake
    if: >-
      contains(github.event.issue.labels.*.name, 'red-mod') &&
      (github.event.action != 'labeled' || github.event.label.name == 'red-mod')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the issue form template
      issues: write # the comment
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Post or update the Modrinth and board comment
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SITE_URL: ${{ vars.SITE_URL || 'https://jarrow.pages.dev' }}
        run: |
          # jarrow:red-mod-intake (docs/community-automation.md)
          import base64
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          MARKER = "<!-- jarrow:red-mod-intake -->"
          FIELD_IDS = ("source-mod-url", "mod-url")
          FALLBACK_LABELS = ("Source mod URL", "Modrinth mod URL", "Mod URL")
          DIRECTION_FIELD = "direction"
          LOADER_NAMES = {"fabric": "Fabric", "neoforge": "NeoForge", "forge": "Forge", "quilt": "Quilt"}
          TEMPLATE = ".github/ISSUE_TEMPLATE/red-mod-report.yml"
          PINNED = ("1.20.1", "1.21.1", "1.21.11")
          MODRINTH_API = "https://api.modrinth.com/v2"
          PROJECT_TYPES = frozenset({"mod", "plugin", "datapack", "shader", "resourcepack", "modpack", "project"})
          SLUG = re.compile(r"^[A-Za-z0-9_.+!@$(),'-]{1,64}$")
          USER_AGENT = "MosheByte/jarrow red-mod-intake (+https://github.com/MosheByte/jarrow)"
          MAX_BYTES = 32 * 1024 * 1024
          BOT_LOGIN = "github-actions[bot]"
          NO_RESPONSE = "_No response_"


          class GhError(RuntimeError):
              pass


          class FetchError(RuntimeError):
              pass


          def gh(*args, stdin=None):
              proc = subprocess.run(["gh", *args], input=stdin, capture_output=True, check=False)
              if proc.returncode != 0:
                  lines = [ln for ln in proc.stderr.decode("utf-8", "replace").splitlines() if ln.strip()]
                  raise GhError(lines[-1] if lines else f"gh exited with {proc.returncode}")
              return proc.stdout


          def api(path, method="GET", body=None):
              args = ["api", "-H", "Accept: application/vnd.github+json", "-X", method, path]
              stdin = None
              if body is not None:
                  args += ["--input", "-"]
                  stdin = json.dumps(body).encode("utf-8")
              out = gh(*args, stdin=stdin)
              return json.loads(out) if out.strip() else None


          def api_all(path):
              out = gh("api", "-H", "Accept: application/vnd.github+json", "--paginate", "--slurp", path)
              pages = json.loads(out) if out.strip() else []
              return [item for page in pages for item in (page or [])]


          def fetch_json(url):
              """GET a JSON document with the project's User-Agent. 404 gives None."""
              request = urllib.request.Request(url, headers={"User-Agent": USER_AGENT, "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = response.read(MAX_BYTES + 1)
              except urllib.error.HTTPError as err:
                  if err.code == 404:
                      return None
                  raise FetchError(f"HTTP {err.code}") from err
              except (urllib.error.URLError, TimeoutError, OSError) as err:
                  raise FetchError(str(getattr(err, "reason", err))) from err
              if len(data) > MAX_BYTES:
                  raise FetchError("response too large")
              try:
                  return json.loads(data.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as err:
                  raise FetchError("not JSON") from err


          def now():
              return datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")


          # ------------------------------------------------------------ the issue form


          def form_labels(template):
              """{field id: label} from an issue form template, without a YAML parser."""
              labels, current, label = {}, None, None
              for line in template.splitlines():
                  if re.match(r"^\s*-\s*type:", line):
                      if current and label:
                          labels[current] = label
                      current, label = None, None
                      continue
                  m = re.match(r"^\s*id:\s*(['\"]?)([\w-]+)\1\s*$", line)
                  if m and current is None:
                      current = m.group(2)
                      continue
                  m = re.match(r"^\s*label:\s*(.+?)\s*$", line)
                  if m and label is None and not line.lstrip().startswith("-"):
                      label = m.group(1).strip("'\"")
              if current and label:
                  labels[current] = label
              return labels


          def form_sections(body):
              """{heading: value} for an issue rendered from a form ("### Label" then the value)."""
              sections = {}
              parts = re.split(r"^###[ \t]+(.+?)[ \t]*$", body.replace("\r\n", "\n"), flags=re.MULTILINE)
              for heading, value in zip(parts[1::2], parts[2::2]):
                  value = value.strip()
                  sections.setdefault(heading.strip(), "" if value == NO_RESPONSE else value)
              return sections


          def form_url(body, labels):
              """The value of the mod URL field, else the first Modrinth link anywhere in the body."""
              sections = form_sections(body)
              wanted = [labels[i] for i in FIELD_IDS if i in labels] + list(FALLBACK_LABELS)
              for label in wanted:
                  if sections.get(label):
                      return sections[label]
              m = re.search(r"https?://(?:www\.)?modrinth\.com/[^\s)>\]]+", body)
              return m.group(0) if m else ""


          def direction_label(direction):
              source, target = direction.split("-")
              return f"{LOADER_NAMES[source]} → {LOADER_NAMES[target]}"


          def form_direction(body, labels):
              """The form's direction as an id such as "fabric-neoforge" ("Fabric → NeoForge"), or None."""
              value = form_sections(body).get(labels.get(DIRECTION_FIELD) or "Direction") or ""
              names = {name.lower(): loader for loader, name in LOADER_NAMES.items()}
              m = re.fullmatch(r"\s*([A-Za-z]+)\s*(?:→|->|-|to)\s*([A-Za-z]+)\s*", value)
              if not m:
                  return None
              source, target = (names.get(g.lower(), g.lower()) for g in m.groups())
              if source in LOADER_NAMES and target in LOADER_NAMES and source != target:
                  return f"{source}-{target}"
              return None


          def modrinth_slug(value):
              """The project slug or id in a Modrinth project URL, or None."""
              m = re.search(r"(?:https?://)?(?:www\.)?modrinth\.com/[^\s)>\]]+|https?://[^\s)>\]]+", value)
              if not m:
                  return None
              url = m.group(0) if "://" in m.group(0) else "https://" + m.group(0)
              parts = urllib.parse.urlsplit(url)
              if parts.scheme not in ("http", "https") or (parts.hostname or "") not in ("modrinth.com", "www.modrinth.com"):
                  return None
              segments = [s for s in parts.path.split("/") if s]
              if len(segments) < 2 or segments[0] not in PROJECT_TYPES:
                  return None
              slug = urllib.parse.unquote(segments[1])
              return slug if SLUG.match(slug) else None


          # ------------------------------------------------------------ rendering


          def md(text):
              text = str(text).replace("\r", " ").replace("\n", " ").replace("|", "\\|")
              text = text.replace("<!--", "&lt;!--")
              return re.sub(r"@(?=[A-Za-z0-9_-])", "@​", text)


          def code(text):
              return "`" + str(text).replace("`", "'").replace("\n", " ") + "`"


          def newest_per_version(versions):
              """{pinned game version: newest Modrinth version that lists it}."""
              out = {}
              for gv in PINNED:
                  listed = [v for v in versions if gv in (v.get("game_versions") or [])]
                  if listed:
                      out[gv] = max(listed, key=lambda v: v.get("date_published") or "")
              return out


          def neoforge_versions(versions):
              return [gv for gv in PINNED if any(
                  gv in (v.get("game_versions") or []) and "neoforge" in (v.get("loaders") or []) for v in versions
              )]


          def primary_file(version):
              files = version.get("files") or []
              return next((f for f in files if f.get("primary")), files[0] if files else None)


          def board_row(board, project, direction=None):
              """The project's row in board.json (schema 2, docs/board.md): one row per mod per
              direction column, so the form's direction picks the column when it names one."""
              for row in (board or {}).get("rows") or []:
                  if direction and row.get("direction") != direction:
                      continue
                  if project.get("id") == row.get("project_id") or (row.get("slug") and row.get("slug") == project.get("slug")):
                      return row
              return None


          def has_column(board, direction):
              """False when board.json lists the direction without a column; True otherwise."""
              for d in (board or {}).get("directions") or []:
                  if isinstance(d, dict) and d.get("id") == direction:
                      return bool(d.get("column"))
              return True


          def board_lines(board, board_error, project, site, direction=None):
              title = md(project.get("title") or project.get("slug"))
              if board_error:
                  return [f"Board: {site}/api/board.json could not be read ({md(board_error)}); this comment updates on the next edit."]
              if direction and board is not None and not has_column(board, direction):
                  return [f"Board: {direction_label(direction)} has no column on [the board]({site}/board/) yet, so there is no row for {title} in that direction."]
              if board is None or not (board.get("rows") or []):
                  return [f"Board: no rows yet (no nightly has filled [the board]({site}/board/)), so there is no row for {title}."]
              row = board_row(board, project, direction)
              generated = board.get("generated_at") or "unknown time"
              if row is None:
                  where = f" in the {direction_label(direction)} column" if direction else ""
                  return [f"Board: {title} is not on [the board]({site}/board/){where} generated {md(generated)}."]
              anchor = f"{site}/board/#mod-{urllib.parse.quote(str(project.get('id')), safe='')}"
              row_direction = row.get("direction")
              details = [
                  ("Direction", direction_label(row_direction) if row_direction in {f"{a}-{b}" for a in LOADER_NAMES for b in LOADER_NAMES if a != b} else None),
                  ("Result", row.get("outcome")),
                  ("Tier", row.get("tier")),
                  ("Reason", row.get("reason")),
                  ("Game version", row.get("primary_game_version")),
                  ("Last run", row.get("last_run")),
              ]
              lines = [f"Board: [the row for {title}]({anchor}), board generated {md(generated)}.", "", "| | |", "| --- | --- |"]
              lines += [f"| {k} | {md(v)} |" for k, v in details if v not in (None, "")]
              report = row.get("report_url")
              if isinstance(report, str) and report.startswith("https://"):
                  lines.append(f"| Report | [report]({report}) |")
              return lines


          def render_project(project, versions, board, board_error, site, when, direction=None):
              title = md(project.get("title") or project.get("slug"))
              page = f"https://modrinth.com/{project.get('project_type') or 'mod'}/{urllib.parse.quote(str(project.get('slug')), safe='')}"
              lic = project.get("license") or {}
              license_text = md(lic.get("id") or "unknown")
              if lic.get("name") and lic.get("name") != lic.get("id"):
                  license_text += f" ({md(lic['name'])})"
              if isinstance(lic.get("url"), str) and lic["url"].startswith("https://"):
                  license_text = f"[{license_text}]({lic['url']})"
              game_versions = project.get("game_versions") or []
              pinned_listed = [gv for gv in PINNED if gv in game_versions]
              neo = neoforge_versions(versions)
              rows = [
                  ("Mod id", f"{code(project.get('id'))} (slug {code(project.get('slug'))})"),
                  ("Title", title),
                  ("License", license_text),
                  (
                      "Client side / server side",
                      f"{md(project.get('client_side') or 'unknown')} / {md(project.get('server_side') or 'unknown')}",
                  ),
                  ("Loaders", md(", ".join(project.get("loaders") or []) or "none listed")),
                  (
                      "Game versions",
                      f"{len(game_versions)} listed; pinned: {', '.join(pinned_listed) or 'none of ' + ', '.join(PINNED)}",
                  ),
                  ("Downloads", f"{int(project.get('downloads') or 0):,}"),
                  (
                      "NeoForge build on Modrinth",
                      ("yes, for " + ", ".join(neo)) if neo else (
                          "yes, but not for a pinned version" if "neoforge" in (project.get("loaders") or []) else "no"
                      ),
                  ),
              ]
              lines = [
                  MARKER,
                  f"What Modrinth and the board say about [{title}]({page}), read {when}. "
                  "The NeoForge line comes from Modrinth's loader tags, not from the author.",
                  "",
                  "| | |",
                  "| --- | --- |",
              ]
              lines += [f"| {k} | {v} |" for k, v in rows]
              lines += ["", "Newest file per pinned game version:", "", "| Game version | File | Loaders | Published | NeoForge build |", "| --- | --- | --- | --- | --- |"]
              newest = newest_per_version(versions)
              for gv in PINNED:
                  version = newest.get(gv)
                  if version is None:
                      lines.append(f"| {gv} | none | | | {'yes' if gv in neo else 'no'} |")
                      continue
                  f = primary_file(version) or {}
                  name = md(f.get("filename") or version.get("version_number") or "file")
                  url = f.get("url") if isinstance(f.get("url"), str) and f["url"].startswith("https://") else None
                  label = f"[{name}]({url})" if url else name
                  label += f" ({code(version.get('version_number'))}, {md(version.get('version_type') or 'release')})"
                  published = md((version.get("date_published") or "")[:10])
                  loaders = md(", ".join(version.get("loaders") or []))
                  lines.append(f"| {gv} | {label} | {loaders} | {published} | {'yes' if gv in neo else 'no'} |")
              lines.append("")
              lines += board_lines(board, board_error, project, site, direction)
              lines += ["", "This comment is updated when the issue is edited."]
              return "\n".join(lines) + "\n"


          def render_problem(message):
              return "\n".join([MARKER, message, "", "This comment is updated when the issue is edited."]) + "\n"


          # ------------------------------------------------------------ main


          def upsert(repo, number, body):
              comments = api_all(f"repos/{repo}/issues/{number}/comments?per_page=100")
              mine = [c for c in comments if MARKER in (c.get("body") or "") and (c.get("user") or {}).get("login") == BOT_LOGIN]
              if mine:
                  if mine[0].get("body") != body:
                      api(f"repos/{repo}/issues/comments/{mine[0]['id']}", "PATCH", {"body": body})
                      print(f"red-mod-intake: updated the comment on #{number}")
                  else:
                      print(f"red-mod-intake: the comment on #{number} is up to date")
                  return
              api(f"repos/{repo}/issues/{number}/comments", "POST", {"body": body})
              print(f"red-mod-intake: commented on #{number}")


          def template_labels(repo, branch):
              try:
                  data = api(f"repos/{repo}/contents/{TEMPLATE}?ref={urllib.parse.quote(branch, safe='')}") or {}
                  text = base64.b64decode(data.get("content") or "").decode("utf-8", "replace")
              except (GhError, ValueError) as err:
                  print(f"red-mod-intake: reading {TEMPLATE} failed ({err}); using the known labels")
                  return {}
              return form_labels(text)


          def build(env):
              repo = env["REPO"]
              site = (env.get("SITE_URL") or "https://jarrow.pages.dev").rstrip("/")
              issue = api(f"repos/{repo}/issues/{int(env['ISSUE_NUMBER'])}") or {}
              labels = template_labels(repo, env.get("DEFAULT_BRANCH") or "main")
              value = form_url(issue.get("body") or "", labels)
              direction = form_direction(issue.get("body") or "", labels)
              if not value:
                  return render_problem(
                      "The form has no Modrinth URL. Edit the issue and put the mod's page, such as "
                      "`https://modrinth.com/mod/<slug>`, in the URL field."
                  )
              slug = modrinth_slug(value)
              if slug is None:
                  return render_problem(
                      f"{code(value[:200])} is not a Modrinth project URL. Edit the issue and use the mod's page, "
                      "such as `https://modrinth.com/mod/<slug>`."
                  )
              quoted = urllib.parse.quote(slug, safe="")
              try:
                  project = fetch_json(f"{MODRINTH_API}/project/{quoted}")
              except FetchError as err:
                  return render_problem(f"Modrinth did not answer for {code(slug)} ({md(err)}).")
              if not isinstance(project, dict):
                  return render_problem(f"Modrinth has no project {code(slug)}.")
              try:
                  versions = fetch_json(f"{MODRINTH_API}/project/{urllib.parse.quote(str(project.get('id')), safe='')}/version") or []
              except FetchError as err:
                  print(f"red-mod-intake: versions of {slug}: {err}")
                  versions = []
              board, board_error = None, None
              try:
                  board = fetch_json(f"{site}/api/board.json")
              except FetchError as err:
                  board_error = str(err)
              return render_project(
                  project, versions if isinstance(versions, list) else [], board, board_error, site, now(), direction
              )


          def main(env):
              body = build(env)
              upsert(env["REPO"], int(env["ISSUE_NUMBER"]), body)
              return 0


          if __name__ == "__main__":
              sys.exit(main(os.environ))
