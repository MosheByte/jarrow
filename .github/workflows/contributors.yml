# Refreshes "Who works on Jarrow" every night: the README section between the all-contributors
# markers, .all-contributorsrc, docs/team.md and site/src/data/team.json. tools/contributors.py
# writes all four, with each member's commit count on main; nobody edits them by hand. The same
# job writes the contributor numbers for LEDGER.md (tools/contributors.py --ledger, then
# tools/ledger.py).
# Every change goes through a pull request, the bot's included. tools/bot_pr.sh commits the
# outputs as github-actions[bot] on a bot/contributors-<date> branch, pushes it and opens the
# pull request with the workflow token, turns on auto-merge, and starts ci.yml and harness.yml
# on the branch with workflow_dispatch (a push made with the workflow token starts no
# workflow), so the head commit gets ci-ok. Nothing is pushed to main. The commit carries the
# trailer "Jarrow-Generated: contributors", which tools/contributors.py leaves out of every
# count, so a refresh never causes another one. See docs/community-automation.md.
name: contributors

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contributors
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh
    # Only main's copy of this workflow opens refresh pull requests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Push the bot/ branch and enable auto-merge. The main ruleset accepts changes to main
      # only through a pull request, so the token cannot push to main itself.
      contents: write
      actions: write # gh workflow run ci.yml and harness.yml on the bot branch
      checks: read # the GitHub Apps behind check suites and check runs on main
      pull-requests: write # open the bot pull request; read bot and merged PR authors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Regenerate the list and the contributor numbers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/contributors.py
          python tools/contributors.py --ledger
          python tools/ledger.py
      - name: Open the refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/contributors-pr.md"
          cat > "$body" <<'EOF'
          Nightly refresh of "Who works on Jarrow" and the contributor numbers in LEDGER.md.

          Regenerated by `tools/contributors.py`, `tools/contributors.py --ledger` and `tools/ledger.py` in the nightly contributors workflow. Nobody edits these files by hand.
          EOF
          bash tools/bot_pr.sh contributors "chore(team): refresh the contributors list" "$body" -- \
            README.md .all-contributorsrc docs/team.md site/src/data/team.json \
            ledger/inputs/contributors.json LEDGER.md
