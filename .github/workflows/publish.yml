# Publishes the pre-alpha releases that hold the name `jarrow` on crates.io and npm
# (D-012, docs/releases.md). Manual only, and only from main:
#   gh workflow run publish.yml --repo jarrow-dev/jarrow --ref main -f what=both
# crates: packages and builds both crates first, publishes jarrow-report, waits until
#   crates.io serves it, then publishes jarrow, which depends on it.
# npm: npm-tokens builds the CLI and writes tokens.css and tokens.json (never committed);
#   npm publishes packages/npm with provenance. Only the npm job can request an OIDC token,
#   and it runs no code that was built in this run.
# A version that a registry already has is skipped, so a failed run can be run again.
# Secrets: CARGO_REGISTRY_TOKEN and NPM_TOKEN, each given only to the step that uploads.
name: publish

on:
  workflow_dispatch:
    inputs:
      what:
        description: What to publish
        type: choice
        options: [crates, npm, both]
        default: both
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # crates.io asks API clients for a User-Agent that names them and how to reach them.
  CRATES_UA: "jarrow-publish (github.com/jarrow-dev/jarrow)"

jobs:
  crates:
    name: crates
    if: inputs.what == 'crates' || inputs.what == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::publish.yml publishes from main only; this run is on $GITHUB_REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          meta=$(cargo metadata --no-deps --format-version 1 --locked)
          report=$(jq -r '.packages[] | select(.name == "jarrow-report") | .version' <<< "$meta")
          cli=$(jq -r '.packages[] | select(.name == "jarrow") | .version' <<< "$meta")
          if [ -z "$report" ] || [ "$report" != "$cli" ]; then
            echo "::error::jarrow-report ($report) and jarrow ($cli) must share the workspace version"
            exit 1
          fi
          echo "version=$report" >> "$GITHUB_OUTPUT"
          echo "Version $report"
      # Builds jarrow against the packaged jarrow-report, so nothing is uploaded unless both work.
      - name: Package and build both crates
        run: cargo package -p jarrow-report -p jarrow --locked
      - name: Publish jarrow-report, wait for crates.io, then publish jarrow
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          on_crates_io() { # <crate> <version>: the API lists that version
            [ "$(curl -sS -o /dev/null -w '%{http_code}' -A "$CRATES_UA" \
              "https://crates.io/api/v1/crates/$1/$2" || true)" = 200 ]
          }
          in_index() { # <crate> <version>: the sparse index, which cargo resolves from, has it
            curl -sS -A "$CRATES_UA" "https://index.crates.io/${1:0:2}/${1:2:2}/$1" 2>/dev/null \
              | grep -qF "\"vers\":\"$2\""
          }
          wait_for() { # <crate> <version>: up to 10 minutes
            for attempt in $(seq 1 60); do
              if on_crates_io "$1" "$2" && in_index "$1" "$2"; then
                echo "$1 $2 is on crates.io and in the index (check $attempt)"
                return 0
              fi
              echo "Check $attempt: $1 $2 is not served yet"
              sleep 10
            done
            echo "::error::$1 $2 did not appear on crates.io within 10 minutes"
            return 1
          }
          for crate in jarrow-report jarrow; do
            if on_crates_io "$crate" "$VERSION"; then
              echo "::notice::$crate $VERSION is already on crates.io; not published again"
            else
              cargo publish -p "$crate" --locked
            fi
            wait_for "$crate" "$VERSION"
            echo "- [$crate $VERSION](https://crates.io/crates/$crate/$VERSION)" >> "$GITHUB_STEP_SUMMARY"
          done

  npm-tokens:
    name: npm tokens
    if: inputs.what == 'npm' || inputs.what == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - name: Write tokens.css and tokens.json with the CLI
        run: |
          set -euo pipefail
          cargo build --locked --release -p jarrow
          jarrow=target/release/jarrow
          "$jarrow" --version
          "$jarrow" tokens > packages/npm/tokens.css
          "$jarrow" tokens --json > packages/npm/tokens.json
          jq -e '.tokens | length > 0' packages/npm/tokens.json > /dev/null
          if ! cmp -s packages/npm/tokens.css site/src/styles/tokens.css; then
            echo "::error::jarrow tokens differs from site/src/styles/tokens.css"
            exit 1
          fi
          wc -c packages/npm/tokens.css packages/npm/tokens.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tokens
          path: |
            packages/npm/tokens.css
            packages/npm/tokens.json
          if-no-files-found: error
          retention-days: 5

  npm:
    name: npm
    needs: npm-tokens
    if: inputs.what == 'npm' || inputs.what == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance: Sigstore signs the package with this run's identity
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - name: Publish only from main
        if: github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          echo "::error::publish.yml publishes from main only; this run is on $GITHUB_REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tokens
          path: packages/npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Show what the package contains
        run: |
          set -euo pipefail
          test -s tokens.css
          test -s tokens.json
          npm pack --dry-run
      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # npm refuses a prerelease without --tag: 0.1.0-alpha.1 goes out under "alpha".
          case "$version" in
            *-*) tag=${version#*-}; tag=${tag%%.*} ;;
            *) tag=latest ;;
          esac
          if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "::notice::$name $version is already on npm; not published again"
          else
            npm publish --provenance --access public --tag "$tag"
          fi
          for attempt in $(seq 1 30); do
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              npm view "$name" dist-tags
              echo "- [$name $version](https://www.npmjs.com/package/$name/v/$version) (tag $tag)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Check $attempt: $name $version is not served yet"
            sleep 10
          done
          echo "::error::$name $version did not appear on npm within 5 minutes"
          exit 1
