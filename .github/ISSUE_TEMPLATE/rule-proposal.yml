name: Rule proposal
description: Propose a rule that maps a Fabric API symbol to its NeoForge counterpart.
title: "[rule] "
labels: ["rule"]
body:
  - type: markdown
    attributes:
      value: |
        A rule describes how one Fabric API shape becomes a NeoForge shape. The format is in [docs/rules.md](https://github.com/MosheByte/jarrow/blob/main/docs/rules.md) (draft, implemented in M2).

        **Clean room.** Describe API shapes only: class, method and field names, descriptors, timing, cancellation, return values. Use public documentation and the open-source API repositories. Never paste code from a mod, and never code from Sinytra Connector, Architectury or Forgified Fabric API. Their public issue trackers may be cited as sources.

        Rule tables are CC0-1.0. By proposing a rule you agree that what you write here may be used in them under that license.
  - type: input
    id: fabric-symbol
    attributes:
      label: Fabric API symbol
      description: Fully qualified class, field or method, with the Fabric API module.
      placeholder: net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents.END_SERVER_TICK (fabric-lifecycle-events-v1)
    validations:
      required: true
  - type: input
    id: neoforge-counterpart
    attributes:
      label: NeoForge counterpart
      description: The NeoForge class, event or method it maps to, or "none" if there is no clean counterpart.
      placeholder: net.neoforged.neoforge.event.tick.ServerTickEvent.Post on NeoForge.EVENT_BUS
    validations:
      required: true
  - type: dropdown
    id: game-versions
    attributes:
      label: Game versions
      multiple: true
      options:
        - "1.21.1"
        - "1.21.11"
    validations:
      required: true
  - type: textarea
    id: semantic-differences
    attributes:
      label: Semantic differences
      description: How the two behave differently. Cover timing, ordering, cancellation, return values, arguments and which side (client or server) it runs on. Write "none found" only after checking each.
    validations:
      required: true
  - type: textarea
    id: public-sources
    attributes:
      label: Public sources
      description: Links to documentation or source files, pinned to a tag or commit where possible, and their licenses.
    validations:
      required: true
  - type: textarea
    id: mods-affected
    attributes:
      label: Mods affected
      description: Modrinth links to mods that use this symbol, or a board reason that points at it. Links only, no code.
  - type: checkboxes
    id: clean-room
    attributes:
      label: Clean room
      options:
        - label: This proposal describes API shapes only and contains no code copied from a mod, Sinytra Connector, Architectury or Forgified Fabric API.
          required: true
