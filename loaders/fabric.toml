# Fabric loader profile. Format: docs/loaders.md.
# Every fact comes from research-lock.json or docs/research/. "unknown" means not
# researched yet; the comment beside it names the research still needed.

schema = 1
id = "fabric"
name = "Fabric"
modrinth_loader = "fabric"   # the facet tools/research_versions.py queries (categories:fabric)
lock_section = "fabric"
research = ["docs/research/fabric-neoforge-notes.md", "research-lock.json"]

# --------------------------------------------------------------------------- 1.20.1
# The same Fabric Loader 0.20.1 serves 1.20.1 (research-lock.json), so the loader's own facts
# (manifest, mod id, entrypoints, Mixin, access widener, server launcher) are the ones
# researched for 0.20.1. Fabric API on 1.20.1 is 0.92.12+1.20.1, which the research has not
# read yet: its events, registry sync, resource conditions and networking stay "unknown".

[versions."1.20.1"]
status = "partial"
loader = "0.20.1"
java = "17"   # the game's Java version (research-lock.json mojang.java_major); Fabric API 0.92.12 requires java >=17

[versions."1.20.1".manifest]
path = "fabric.mod.json"
format = "json"
schema = "schemaVersion 1"
source = "docs/research/fabric-neoforge-notes.md#3-fabricmodjson-schema-v1-and-the-neoforge-counterpart"

[versions."1.20.1".mod_id]
rule = "starts with a lowercase letter; then lowercase letters, digits, '-' or '_'; 2 to 64 characters"
pattern = "^[a-z][a-z0-9-_]{1,63}$"
source = "docs/research/fabric-neoforge-notes.md#3-fabricmodjson-schema-v1-and-the-neoforge-counterpart"

[versions."1.20.1".entrypoints]
model = "manifest-keys"
kinds = ["main", "client", "server", "preLaunch"]
order = ["preLaunch", "main", "client (physical client) or server (dedicated server)"]
source = "docs/research/fabric-neoforge-notes.md#2-fabric-entrypoints"

# research needed: the event classes of Fabric API 0.92.12+1.20.1 (fabric-api-base and the event modules)
[versions."1.20.1".events]
model = "unknown"
ordering = "unknown"
cancellation = "unknown"
summary = "unknown"
source = "unknown"

# research needed: when Fabric API 0.92.12+1.20.1's registry sync freezes the registries
[versions."1.20.1".registration]
model = "unknown"
freeze = "unknown"
summary = "unknown"
source = "unknown"

[versions."1.20.1".mappings]
runtime = "intermediary"   # research-lock.json pins net.fabricmc:intermediary:1.20.1
source = "docs/research/fabric-neoforge-notes.md#1-names-at-runtime-mappings"

[versions."1.20.1".mixin]
service = "bundled with Fabric Loader"
artifact = "net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7"
mixinextras = "mixinextras-fabric 0.5.5"
configs = "listed in fabric.mod.json mixins, each with an optional environment"
source = "docs/research/fabric-neoforge-notes.md#8-mixin-refmaps-and-loader-differences"

[versions."1.20.1".access]
format = "access-widener"
path = "named by the accessWidener key in fabric.mod.json"
namespace = "intermediary"
source = "docs/research/fabric-neoforge-notes.md#9-access-wideners-vs-access-transformers"

# research needed: the resource-conditions API in Fabric API 0.92.12+1.20.1
[versions."1.20.1".resources]
condition_key = "unknown"
condition_id_field = "unknown"
source = "unknown"

# research needed: Fabric's networking API on 1.20.1, which predates the vanilla
# CustomPacketPayload model of 1.20.5 (docs/research/fabric-neoforge-notes.md, section 11)
[versions."1.20.1".networking]
family = "unknown"
summary = "unknown"
source = "unknown"

[versions."1.20.1".harness]
install = "server-launcher"
lock = "game_versions.1.20.1.fabric.harness"
summary = "The meta.fabricmc.net server launcher with the verified Mojang server jar; fallback: the hash-pinned installer in server mode."
source = "docs/research/fabric-neoforge-notes.md#13-harness-provisioning"

[versions."1.20.1".api]
name = "Fabric API"
separate = true
artifact = "net.fabricmc.fabric-api:fabric-api:0.92.12+1.20.1"
source = "research-lock.json"

# --------------------------------------------------------------------------- 1.21.1

[versions."1.21.1"]
status = "researched"
loader = "0.20.1"
java = "21"

[versions."1.21.1".manifest]
path = "fabric.mod.json"
format = "json"
schema = "schemaVersion 1"
source = "docs/research/fabric-neoforge-notes.md#3-fabricmodjson-schema-v1-and-the-neoforge-counterpart"

[versions."1.21.1".mod_id]
rule = "starts with a lowercase letter; then lowercase letters, digits, '-' or '_'; 2 to 64 characters"
pattern = "^[a-z][a-z0-9-_]{1,63}$"
source = "docs/research/fabric-neoforge-notes.md#3-fabricmodjson-schema-v1-and-the-neoforge-counterpart"

[versions."1.21.1".entrypoints]
model = "manifest-keys"
kinds = ["main", "client", "server", "preLaunch"]
order = ["preLaunch", "main", "client (physical client) or server (dedicated server)"]
source = "docs/research/fabric-neoforge-notes.md#2-fabric-entrypoints"

[versions."1.21.1".events]
model = "callback-fields"
ordering = "by phase (default phase fabric:default, ordered with addPhaseOrdering), then registration order"
cancellation = "callback return value; for interaction callbacks the first non-pass result wins"
summary = "An Event<T> held in a static field, usually EVENT on the callback interface; listeners are added with register."
source = "docs/research/fabric-neoforge-notes.md#6-events-fabric-callbacks-vs-neoforge-subscribers"

[versions."1.21.1".registration]
model = "direct"
freeze = "after mod initialisation; on a dedicated server after the entrypoints ran (Fabric API registry sync)"
summary = "Registry.register works anywhere inside onInitialize."
source = "docs/research/fabric-neoforge-notes.md#5-registries-deferredregister-registerevent-freezing"

[versions."1.21.1".mappings]
runtime = "intermediary"
source = "docs/research/fabric-neoforge-notes.md#1-names-at-runtime-mappings"

[versions."1.21.1".mixin]
service = "bundled with Fabric Loader"
artifact = "net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7"
mixinextras = "mixinextras-fabric 0.5.5"
configs = "listed in fabric.mod.json mixins, each with an optional environment"
source = "docs/research/fabric-neoforge-notes.md#8-mixin-refmaps-and-loader-differences"

[versions."1.21.1".access]
format = "access-widener"
path = "named by the accessWidener key in fabric.mod.json"
namespace = "intermediary"
source = "docs/research/fabric-neoforge-notes.md#9-access-wideners-vs-access-transformers"

[versions."1.21.1".resources]
condition_key = "fabric:load_conditions"
condition_id_field = "condition"
source = "docs/research/fabric-neoforge-notes.md#10-resource-conditions"

[versions."1.21.1".networking]
family = "fabric-networking-api-v1"
summary = "Payload types in PayloadTypeRegistry, receivers through ServerPlayNetworking and ClientPlayNetworking, over vanilla CustomPacketPayload; server handlers run on the server thread."
source = "docs/research/fabric-neoforge-notes.md#11-networking-payloads"

[versions."1.21.1".harness]
install = "server-launcher"
lock = "game_versions.1.21.1.fabric.harness"
summary = "The meta.fabricmc.net server launcher with the verified Mojang server jar; fallback: the hash-pinned installer in server mode."
source = "docs/research/fabric-neoforge-notes.md#13-harness-provisioning"

[versions."1.21.1".api]
name = "Fabric API"
separate = true
artifact = "net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1"
source = "research-lock.json"

