# Quilt loader profile. Format: docs/loaders.md.
# Facts come from research-lock.json (the Quilt Loader, installer and API pins).
# Everything else is "unknown" until it is researched; the comment above each table
# names the research still needed.

schema = 1
id = "quilt"
name = "Quilt"
modrinth_loader = "unknown"   # research needed: the Modrinth loader tag for Quilt projects (https://api.modrinth.com/v2/tag/loader)
lock_section = "quilt"
research = ["research-lock.json"]

# --------------------------------------------------------------------------- 1.20.1

[versions."1.20.1"]
status = "partial"
loader = "0.30.2"
java = "17"   # the game's Java version (research-lock.json mojang.java_major)

# research needed: Quilt's manifest (path, format, schema). The lock names quilt.mod.json for the loader itself and records that Quilt Loader provides fabricloader to Fabric mods; how far it loads Fabric mods as they are is not researched yet
[versions."1.20.1".manifest]
path = "unknown"
format = "unknown"
schema = "unknown"
source = "unknown"

# research needed: Quilt's mod-id rule and its exact pattern
[versions."1.20.1".mod_id]
rule = "unknown"
pattern = "unknown"
source = "unknown"

# research needed: Quilt's entrypoint keys and their order
[versions."1.20.1".entrypoints]
model = "unknown"
kinds = "unknown"
order = "unknown"
source = "unknown"

# research needed: Quilt's event model, and how it relates to Fabric API events
[versions."1.20.1".events]
model = "unknown"
ordering = "unknown"
cancellation = "unknown"
summary = "unknown"
source = "unknown"

# research needed: Quilt's registration model and when its registries freeze
[versions."1.20.1".registration]
model = "unknown"
freeze = "unknown"
summary = "unknown"
source = "unknown"

[versions."1.20.1".mappings]
runtime = "intermediary"
source = "research-lock.json game_versions.1.20.1.quilt.runtime_names_evidence"

# research needed: how a Quilt mod declares its mixin configs
[versions."1.20.1".mixin]
service = "bundled with Quilt Loader"
artifact = "net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7"
mixinextras = "MixinExtras 0.5.5"   # the loader depends on mixinextras; its build pins 0.5.5
configs = "unknown"
source = "research-lock.json game_versions.1.20.1.quilt.loader.bundles"

# research needed: whether Quilt uses access wideners, and in which namespace
[versions."1.20.1".access]
format = "unknown"
path = "unknown"
namespace = "unknown"
source = "unknown"

# research needed: Quilt's resource-condition key, and whether it reads fabric:load_conditions
[versions."1.20.1".resources]
condition_key = "unknown"
condition_id_field = "unknown"
source = "unknown"

# research needed: Quilt's networking API, and whether Fabric's networking API runs on it
[versions."1.20.1".networking]
family = "unknown"
summary = "unknown"
source = "unknown"

[versions."1.20.1".harness]
install = "installer"
lock = "game_versions.1.20.1.quilt.harness"
summary = "quilt-installer 0.15.1 installs the server for 1.20.1 and loader 0.30.2; the verified Mojang server jar goes in as server.jar; then java -jar quilt-server-launch.jar nogui."
source = "research-lock.json"

[versions."1.20.1".api]
name = "Quilted Fabric API (QFAPI) with the Quilt Standard Libraries (QSL)"
separate = true
artifact = "org.quiltmc.quilted-fabric-api:quilted-fabric-api:7.7.0+0.92.2-1.20.1"   # the pin is the Modrinth file players install (see maven_note in the lock)
source = "research-lock.json game_versions.1.20.1.quilt.api"

