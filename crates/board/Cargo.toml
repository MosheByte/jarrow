[package]
name = "jarrow-board"
description = "Jarrow nightly board pipeline: the Modrinth mod list, per-mod shards and the merged board."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "jarrow_board"

[[bin]]
name = "jarrow-board"
path = "src/main.rs"

[dependencies]
clap.workspace = true
jarrow-report.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# TLS: rustls with the ring provider and the operating system's root store. ureq's default
# root set (webpki-roots) is CDLA-Permissive-2.0, which deny.toml does not allow.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = { version = "0.8.5", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider"] }
zip = { version = "9.3.0", default-features = false }

[lints]
workspace = true
