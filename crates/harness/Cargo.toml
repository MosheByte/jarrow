[package]
name = "jarrow-harness"
description = "Jarrow parity harness: provisions headless loader servers, validates probe dumps, diffs and scores them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "jarrow_harness"

[dependencies]
jarrow-report.workspace = true
serde.workspace = true
serde_json.workspace = true
regex = "1.12.2"
sha1 = "0.10.6"
sha2 = "0.10.9"
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider"] }
rustls-native-certs = "0.8.3"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[lints]
workspace = true
