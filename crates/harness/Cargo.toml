[package]
name = "jarrow-harness"
description = "Jarrow parity harness: provisions headless loader servers, validates probe dumps, diffs and scores them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "jarrow_harness"

[[bin]]
name = "jarrow-harness"
path = "src/main.rs"

[dependencies]
clap.workspace = true
jarrow-report.workspace = true
serde.workspace = true
serde_json.workspace = true
regex = "1.12.2"
sha1 = "0.11.0"
sha2 = "0.11.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider"] }
rustls-native-certs = { version = "0.8.5", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
