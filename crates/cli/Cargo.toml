[package]
name = "jarrow"
description = "Pre-alpha CLI for Jarrow, a Minecraft mod-loader converter. This release has only --version and tokens; conversion is not built yet."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# Published to crates.io by .github/workflows/publish.yml (D-012).
publish = true
readme = "README.md"
keywords = ["minecraft", "fabric", "neoforge", "mod", "converter"]
categories = ["command-line-utilities", "game-development"]

[[bin]]
name = "jarrow"
path = "src/main.rs"

[dependencies]
clap.workspace = true
jarrow-report.workspace = true

[lints]
workspace = true
