[package]
name = "jarrow-jar"
description = "JAR reading and writing for Jarrow: validated zip input, byte-stable deterministic output, manifests, signatures and nested jars."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "jarrow_jar"

[dependencies]
# Pure-Rust raw DEFLATE (no C, builds for wasm32-unknown-unknown). Its exact version is part
# of the byte-stability contract: Cargo.lock pins it, and a bump can change deflated bytes.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
