[package]
name = "jarrow-report"
description = "Pre-alpha report model and design tokens for Jarrow, a Minecraft mod-loader converter. This release has the tiers, outcomes, report entries and tokens; conversion is not built yet."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# Published to crates.io by .github/workflows/publish.yml (D-012).
publish = true
readme = "README.md"
keywords = ["minecraft", "fabric", "neoforge", "design-tokens", "report"]
categories = ["game-development", "development-tools"]
# tokens_current checks ../../site/tokens.css, which only exists in the repository.
exclude = ["tests/tokens_current.rs"]

[lib]
name = "jarrow_report"

[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
